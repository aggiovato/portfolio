name: CI

# Runs the same gates as `task preflight`, split into jobs so failures are easy to read:
#   quality → static checks + unit/component tests (fast feedback)
#   build   → production build + draft leak check (what a deploy would publish)
#   e2e     → Playwright against a production build with drafts (smoke, i18n, axe)
#   release-check (tags only) → the tag matches package.json and CHANGELOG.md has its section
#   deploy  → only after everything passes: the very dist/ the build job produced goes to Netlify,
#             as a preview for a PR (linked in a comment) or to production for a version tag
#             (vX.Y.Z, created by `task release:*`). A push to main without a tag is tested only.
#             Netlify never builds on its own, so nothing reaches production without this pipeline.
#   release (minor and major tags) → GitHub Release with that version's CHANGELOG section.
# See .claude/rules/testing.md for what each layer covers.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    # Documentation-only changes skip CI (path filters do not apply to tag pushes).
    paths-ignore: ['**/*.md']
    tags: ['v*.*.*']

permissions:
  contents: read

# A new push cancels the previous run of the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):'))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Safety net: neutral placeholders for any referenced image missing from the repo.
      - name: Placeholder images
        run: npm run assets:placeholders
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      # Types of .astro/.ts files and content collection schemas (a broken case study fails here).
      - name: Astro check
        run: npm run check
      - name: Unit & component tests (Vitest)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build & draft check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):'))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Safety net: neutral placeholders for any referenced image missing from the repo.
      - name: Placeholder images
        run: npm run assets:placeholders
      # Production build: no SHOW_DRAFTS, so drafts must not generate routes or sitemap entries.
      - name: Build (production)
        run: npm run build
      - name: Drafts stay out of dist/ and the sitemap
        run: npm run verify:drafts
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):'))
    env:
      # Playwright's own Chromium build; locally the config defaults to the installed Chrome.
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Safety net: neutral placeholders for any referenced image missing from the repo.
      - name: Placeholder images
        run: npm run assets:placeholders
      # Cache the browser download; system libraries are installed on every run.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # playwright.config.ts builds dist-e2e/ (with drafts) and serves it with astro preview.
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release-check:
    name: Release check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Tag, package.json and CHANGELOG agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg."
            exit 1
          fi
          node scripts/changelog.mjs check "$version"

  deploy:
    name: Deploy (Netlify)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quality, build, e2e, release-check]
    # Previews for (non-draft) PRs, production for version tags. release-check only runs for tags,
    # so it may be skipped but never failed.
    if: >-
      !cancelled() && needs.quality.result == 'success' && needs.build.result == 'success' &&
      needs.e2e.result == 'success' && needs.release-check.result != 'failure' &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft))
    # One deploy per branch at a time; a newer push supersedes a queued one.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    environment:
      name: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      # PRs from forks and Dependabot get no secrets: they are tested, not deployed.
      - name: Check credentials
        id: creds
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Netlify secrets not available for this run; skipping deploy."
          fi
      # Only .nvmrc is needed here ; checkout runs first because it cleans the workspace.
      - uses: actions/checkout@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          sparse-checkout: .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          name: dist
          path: dist/
      - uses: actions/setup-node@v7
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version-file: .nvmrc
      - name: Deploy
        id: deploy
        if: steps.creds.outputs.ok == 'true'
        env:
          PROD: ${{ startsWith(github.ref, 'refs/tags/v') }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Message built in the shell: a " #" inside a YAML plain scalar starts a comment.
          if [ "$PROD" = "true" ]; then
            target=(--prod); message="$GITHUB_REF_NAME"
          else
            target=(--alias "pr-$PR_NUMBER"); message="PR $PR_NUMBER"
          fi
          npx -y netlify-cli@27.16.1 deploy --dir dist --site "$NETLIFY_SITE_ID" --no-build \
            "${target[@]}" --message "$message" --json > deploy.json
          url=$(node -e "const d=require('./deploy.json'); console.log(process.env.PROD==='true' ? d.url : d.deploy_url)")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Link the preview in the PR
        if: steps.creds.outputs.ok == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
          PR: ${{ github.event.pull_request.number }}
          # The branch's own commit, not the temporary merge commit GitHub tests on a PR.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          body="Preview: $URL (commit ${HEAD_SHA::7}, after quality, build and e2e passed)"
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --edit-last --body "$body" \
            || gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: deploy
    # Minor and major versions only (x.y.0), like yRest; patches are deployed without a Release.
    if: startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref_name, '.0') && needs.deploy.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the Release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog.mjs notes "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
