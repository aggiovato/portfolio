name: CI

# Runs the same gates as `task preflight`, split into jobs so failures are easy to read:
#   quality → static checks + unit/component tests (fast feedback)
#   build   → production build + draft leak check (what a deploy would publish)
#   e2e     → Playwright against a production build with drafts (smoke, i18n, axe)
#   release-check (tags only) → the tag matches package.json and CHANGELOG.md has its section
#   deploy  → only after everything passes: the very dist/ the build job produced goes to Cloudflare
#             Workers (deploy.yml), as a preview for a PR (linked in a comment) or to production
#             for a version tag (vX.Y.Z, created by `task release:*`). A push to main without a tag
#             is tested only. Netlify is the backup host, used when DEPLOY_TARGETS names it.
#             No host builds on its own, so nothing reaches production without this pipeline.
#   release (minor and major tags) → GitHub Release with that version's CHANGELOG section.
# See .claude/rules/testing.md for what each layer covers.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['**/*.md']
  push:
    branches: [main]
    # Documentation-only changes skip CI (path filters do not apply to tag pushes).
    paths-ignore: ['**/*.md']
    tags: ['v*.*.*']

permissions:
  contents: read

# A new push cancels the previous run of the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):'))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Safety net: neutral placeholders for any referenced image missing from the repo.
      - name: Placeholder images
        run: npm run assets:placeholders
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      # Types of .astro/.ts files and content collection schemas (a broken case study fails here).
      - name: Astro check
        run: npm run check
      - name: Unit & component tests (Vitest)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build & draft check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):'))
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Safety net: neutral placeholders for any referenced image missing from the repo.
      - name: Placeholder images
        run: npm run assets:placeholders
      # Production build: no SHOW_DRAFTS, so drafts must not generate routes or sitemap entries.
      - name: Build (production)
        run: npm run build
      - name: Drafts stay out of dist/ and the sitemap
        run: npm run verify:drafts
      # JS and CSS per page (gzip) against scripts/perf-budget.mjs; the table goes to the job summary.
      - name: Performance budget
        run: npm run perf:budget
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft) ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(release):'))
    env:
      # Playwright's own Chromium build; locally the config defaults to the installed Chrome.
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Safety net: neutral placeholders for any referenced image missing from the repo.
      - name: Placeholder images
        run: npm run assets:placeholders
      # Cache the browser download; system libraries are installed on every run.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Playwright browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # playwright.config.ts builds dist-e2e/ (with drafts) and serves it with astro preview.
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  release-check:
    name: Release check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - name: Tag, package.json and CHANGELOG agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg."
            exit 1
          fi
          node scripts/changelog.mjs check "$version"

  # Where the build goes: DEPLOY_TARGETS (a repository variable) is unset or "cloudflare" (default),
  # "netlify" (the backup) or "cloudflare,netlify". Both hosts serve the same dist/.
  cloudflare:
    name: Deploy (Cloudflare)
    needs: [quality, build, e2e, release-check]
    # Previews for (non-draft) PRs, production for version tags. release-check only runs for tags,
    # so it may be skipped but never failed.
    if: >-
      !cancelled() && needs.quality.result == 'success' && needs.build.result == 'success' &&
      needs.e2e.result == 'success' && needs.release-check.result != 'failure' &&
      contains(vars.DEPLOY_TARGETS || 'cloudflare', 'cloudflare') &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft))
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/deploy.yml
    with:
      host: cloudflare
      environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'preview' }}
      pr-number: ${{ github.event.pull_request.number || 0 }}
      # The branch's own commit, not the temporary merge commit GitHub tests on a PR.
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      message: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('PR {0}', github.event.pull_request.number) }}
    secrets: inherit

  netlify:
    name: Deploy (Netlify, backup)
    needs: [quality, build, e2e, release-check]
    if: >-
      !cancelled() && needs.quality.result == 'success' && needs.build.result == 'success' &&
      needs.e2e.result == 'success' && needs.release-check.result != 'failure' &&
      contains(vars.DEPLOY_TARGETS, 'netlify') &&
      (startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft))
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/deploy.yml
    with:
      host: netlify
      environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'preview' }}
      pr-number: ${{ github.event.pull_request.number || 0 }}
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}
      message: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('PR {0}', github.event.pull_request.number) }}
    secrets: inherit

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [cloudflare, netlify]
    # Minor and major versions only (x.y.0), like yRest; patches are deployed without a Release.
    # After every host chosen by DEPLOY_TARGETS succeeded (the other one is skipped).
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') && endsWith(github.ref_name, '.0') &&
      !contains(needs.*.result, 'failure') && contains(needs.*.result, 'success')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the Release from the CHANGELOG section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog.mjs notes "${GITHUB_REF_NAME#v}" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
