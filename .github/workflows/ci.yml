name: CI

# Runs the same gates as `task preflight`, split into jobs so failures are easy to read:
#   quality → static checks + unit/component tests (fast feedback)
#   build   → production build + draft leak check (what a deploy would publish)
#   e2e     → Playwright against a production build with drafts (smoke, i18n, axe)
# See .claude/rules/testing.md for what each layer covers.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# A new push cancels the previous run of the same branch or PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, types & unit tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Provisional images are gitignored: generate neutral placeholders for the missing ones.
      - name: Placeholder images
        run: npm run assets:placeholders
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      # Types of .astro/.ts files and content collection schemas (a broken case study fails here).
      - name: Astro check
        run: npm run check
      - name: Unit & component tests (Vitest)
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build & draft check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || !github.event.pull_request.draft
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Provisional images are gitignored: generate neutral placeholders for the missing ones.
      - name: Placeholder images
        run: npm run assets:placeholders
      # Production build: no SHOW_DRAFTS, so drafts must not generate routes or sitemap entries.
      - name: Build (production)
        run: npm run build
      - name: Drafts stay out of dist/ and the sitemap
        run: npm run verify:drafts
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    if: github.event_name == 'push' || !github.event.pull_request.draft
    env:
      # Playwright's own Chromium build; locally the config defaults to the installed Chrome.
      PW_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Provisional images are gitignored: generate neutral placeholders for the missing ones.
      - name: Placeholder images
        run: npm run assets:placeholders
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # playwright.config.ts builds dist-e2e/ (with drafts) and serves it with astro preview.
      - name: Playwright
        run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
